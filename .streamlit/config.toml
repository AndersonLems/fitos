[server]
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10
# O túnel tem upload de ~5 Mbps: comprimir o websocket reduz gráficos e tabelas enviados a cada interação.
enableWebsocketCompression = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showSidebarNavigation = true

[runner]
magicEnabled = false

[theme]
base = "dark"
primaryColor = "#B5F24A"
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#14181E"
textColor = "#F3F5F7"
borderColor = "#2A3039"
showWidgetBorder = true
baseRadius = "0.625rem"
font = "Geist, system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "'Space Grotesk', sans-serif"
codeFont = "'JetBrains Mono', ui-monospace, monospace"

[theme.sidebar]
backgroundColor = "#0B0D10"
